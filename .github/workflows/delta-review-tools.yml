name: Delta review tools
on:
  push:
    branches: [ci/delta-review-tools-20260914]
permissions:
  contents: read
  actions: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HATCH_ENV: test.spark-3.5.9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6453997a9a4b3ea96bb64e616488bbe18a1d03a4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: pypa/hatch@install
      - uses: actions/download-artifact@v7
        with:
          name: python-package
          path: target/wheels
          run-id: 34852788070
          github-token: ${{ github.token }}
      - name: Install exact PR build
        run: hatch run install-pysail
      - name: Generate snapshots using pytest
        run: hatch run pytest --pyargs pysail.tests.spark.delta.test_delta_features -k conditional_overwrite --snapshot-update
      - name: Verify generated snapshots
        run: hatch run pytest --pyargs pysail.tests.spark.delta.test_delta_features -k conditional_overwrite
      - name: Export generated snapshot
        run: |
          hatch run python - <<'PY'
          import base64
          import json
          from pathlib import Path
          import pysail
          relative = "tests/spark/delta/__snapshots__/features/overwrite.yaml"
          content = (Path(pysail.__file__).parent / relative).read_bytes()
          encoded = base64.b64encode(content).decode("ascii")
          for offset in range(0, len(encoded), 4000):
              print("CODEX_GENERATED " + json.dumps({"path": "python/pysail/" + relative, "offset": offset, "data": encoded[offset:offset+4000]}))
          PY
